# DS224+ (Container Manager): put this file + the repo on the NAS and
#   docker compose up -d
# Then browse to http://<nas-ip>:8770
services:
  partsnas:
    build: .
    image: partsnas:latest
    container_name: partsnas
    restart: unless-stopped
    ports:
      - "8770:8000"
    volumes:
      # keep the database + images on the NAS volume, outside the container
      - ./data:/data
      # Automatic backups (Settings -> Automatic backup) go to /data/backups/auto by default, next to
      # your data. To save them in another NAS folder, map it here and enter /backups as the folder:
      # - /volume1/homes/you/partsnas-backups:/backups
    environment:
      PARTSNAS_DEFAULT_CURRENCY: SEK
      PARTSNAS_DEFAULT_VAT_PERCENT: "25"
      # THERE IS NO LOGIN. Anyone who can reach the port can read, change and delete everything and
      # download a backup that holds your supplier API keys. Keep it on your home LAN, never forward
      # the port on your router, and use a VPN from outside. See docs/security.md.
      # PARTSNAS_API_TOKEN is reserved and is not enforced yet: setting it does nothing.
