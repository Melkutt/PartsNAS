<!doctype html>
<html lang="en" data-theme="gray">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PartsNAS</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link rel="stylesheet" href="/css/theme.css?v=107" />
    <link rel="stylesheet" href="/css/app.css?v=107" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <rect x="6" y="6" width="20" height="20" rx="4.5" fill="var(--accent)" />
            <path d="M11 11 L11 17 Q11 21 15 21 L21 21" fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
            <circle cx="11" cy="11" r="2.1" fill="var(--surface)" />
          </svg>
          Parts<span>NAS</span>
        </div>
        <nav class="tabs" id="tabs"></nav>
        <div class="spacer"></div>
        <span class="scan-ind" id="scan-ind"><span class="dot"></span>Scan</span>
        <button class="ghost" id="btn-import">Import</button>
        <button class="ghost" id="btn-export">Export</button>
        <button class="ghost" id="btn-settings" title="Settings">⚙</button>
        <span class="count-tag" id="ver">…</span>
        <div id="theme-switch"></div>
      </header>
      <main class="body" id="view"></main>
    </div>
    <script type="module" src="/js/app.js?v=109"></script>
  </body>
</html>
